[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[dependencies]
bytes = "1.12"
snap = "1.1"
ahash = "0.8.12"
memchr = "2.8"
memmap2 = "0.9"
parquet = { version = "60.1", default-features = false, features = ["snap"] }
rayon = "1.12"
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
